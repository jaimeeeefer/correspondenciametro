<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correspondencia Metro Bilbao y Bizkaibus</title>
    <meta name="theme-color" content="#d10000">
    <meta name="description" content="Correspondencias entre Metro Bilbao y Bizkaibus en tiempo real">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Metro+Bizkaibus">
    <style>
        :root {
            --bg: #f3f4f7;
            --card: #ffffff;
            --card-2: #f8f9fb;
            --text: #1c1f26;
            --muted: #6b7280;
            --line: #e3e6ec;
            --seg-bg: #e9ebf0;
            --red: #d10000;
            --red-dark: #a00000;
            --blue: #0b6bcb;
            --green: #15803d;
            --bus: #15803d;        /* verde Bizkaibus (títulos y borde) */
            --bus-badge: #15803d;  /* fondo de la etiqueta de línea (texto blanco) */
            --orange: #c2410c;
            --shadow: 0 2px 10px rgba(16, 24, 40, 0.08);
            color-scheme: light dark;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1115;
                --card: #1a1d23;
                --card-2: #20242c;
                --text: #e8eaee;
                --muted: #9aa3b2;
                --line: #2c313b;
                --seg-bg: #262a33;
                --blue: #5aa9ff;
                --green: #4ade80;
                --bus: #4ade80;
                --orange: #fb923c;
                --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
            }
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0 0 env(safe-area-inset-bottom, 0px);
            -webkit-text-size-adjust: 100%;
        }
        .app-header {
            background: linear-gradient(135deg, #d10000, #8f0000);
            color: #fff;
            padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 22px;
            text-align: center;
        }
        .app-header h1 {
            margin: 0;
            font-size: 1.45rem;
            letter-spacing: 0.2px;
        }
        .app-header p {
            margin: 4px 0 0;
            font-size: 0.9rem;
            opacity: 0.85;
        }
        .container {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 16px;
        }
        .panel {
            background: var(--card);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 16px;
            margin-top: -34px;
            position: relative;
        }
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .field { display: flex; flex-direction: column; gap: 6px; }
        label, .field-label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--muted);
        }
        input[type="text"], select {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 16px;
            width: 100%;
            background: var(--card-2);
            color: var(--text);
        }
        input[type="text"]:focus, select:focus {
            outline: 2px solid var(--blue);
            outline-offset: 1px;
        }
        button {
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            background-color: var(--red);
            color: #fff;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        button:hover { background-color: var(--red-dark); }
        button:active { transform: scale(0.98); }

        /* Selector de destino (Ortuella / Trapagaran) */
        .segmented {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 4px;
            background: var(--seg-bg);
            border-radius: 12px;
        }
        .segmented input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .segmented label {
            margin: 0;
            padding: 11px 8px;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            text-transform: none;
            letter-spacing: 0;
            color: var(--muted);
            border-radius: 9px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .segmented input:checked + label {
            background: var(--red);
            color: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        }
        .segmented input:focus-visible + label {
            outline: 2px solid var(--blue);
            outline-offset: 1px;
        }

        /* Resultados */
        .results-container {
            background: var(--card);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border-top: 4px solid var(--red);
            padding: 16px;
            margin-top: 14px;
            min-height: 90px;
        }
        #bizkaibusResults { border-top-color: var(--bus); }
        .results-container h2 {
            margin: 0 0 12px;
            font-size: 1.02rem;
            line-height: 1.3;
            color: var(--red);
        }
        #bizkaibusResults h2 { color: var(--bus); }

        .train-info, .bus-info {
            background: var(--card-2);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .train-info:last-child, .bus-info:last-child { margin-bottom: 0; }
        .card-head {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card-head strong { flex: 1; min-width: 0; }
        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            color: var(--muted);
            font-size: 0.92rem;
        }
        .card-row b {
            color: var(--text);
            font-size: 1.05rem;
            font-variant-numeric: tabular-nums;
        }
        /* Las llegadas son información secundaria: más pequeñas, atenuadas y sangradas */
        .card-row-arrival {
            font-size: 0.8rem;
            padding-left: 12px;
            border-left: 2px solid var(--line);
        }
        .card-row-arrival b {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--muted);
        }
        .badge {
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
        }
        .badge-metro { background: var(--red); }
        .badge-bus { background: var(--bus-badge); }

        .correspondence-text, .correspondencejusta-text {
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .correspondence-text { color: var(--green); background: rgba(21, 128, 61, 0.14); }
        .correspondencejusta-text { color: var(--orange); background: rgba(194, 65, 12, 0.14); }
        .transfer-text {
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            color: var(--blue);
            background: rgba(11, 107, 203, 0.14);
        }

        .bus-status-ontime { color: var(--green); font-weight: 700; }
        .bus-status-early { color: var(--blue); font-weight: 700; }
        .bus-status-late { color: var(--red); font-weight: 700; }
        .bus-status-unknown { color: var(--muted); font-weight: 400; }

        .loading, .hint, .no-results {
            text-align: center;
            padding: 10px;
            margin: 0;
            color: var(--muted);
        }
        .error-message {
            text-align: center;
            padding: 10px;
            margin: 0;
            color: var(--red);
            font-weight: 600;
        }
        .data-source {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            margin: 16px 0 0;
        }
        .data-source.warn { color: var(--orange); }
    </style>
</head>
<body>
    <header class="app-header">
        <h1>Metro Bilbao + Bizkaibus</h1>
        <p>Correspondencias en tiempo real</p>
    </header>

    <main class="container">
        <section class="panel input-section">
            <div class="field">
                <span class="field-label" id="travelDestinationLabel">¿A dónde vas?</span>
                <div class="segmented" role="radiogroup" aria-labelledby="travelDestinationLabel">
                    <input type="radio" id="dest-ortuella" name="travelDestination" value="ORTUELLA" checked>
                    <label for="dest-ortuella">Ortuella</label>
                    <input type="radio" id="dest-trapagaran" name="travelDestination" value="TRAPAGARAN">
                    <label for="dest-trapagaran">Trapagaran</label>
                </div>
            </div>

            <div class="field">
                <label for="metroStationCode">Estación de Metro (origen)</label>
                <input type="text" list="metroStationsList" id="metroStationCode" name="metroStationCode" placeholder="Escribe o selecciona una estación..." autocomplete="off" />
                <datalist id="metroStationsList"></datalist>
            </div>

            <div class="field">
                <label for="bizkaibusDestinationStation">Parada de Bizkaibus (enlace)</label>
                <select id="bizkaibusDestinationStation" name="bizkaibusDestinationStation">
                    <option value="POR">Portugalete (Carlos VII 18) - Parada 450</option>
                    <option value="BAG">Bagatza (Av. Miranda 2) - Parada 411</option>
                    <option value="GUR">Gurutzeta / Cruces (Horacio Etxebarrieta) - Parada 402</option>
                </select>
            </div>

            <button onclick="displayNextArrivalsAndCorrespondence()">Buscar trenes y buses</button>
        </section>

        <section class="results-container" id="metroResults">
            <p class="loading">Esperando selección de estación...</p>
        </section>

        <section class="results-container" id="bizkaibusResults">
            <p class="loading">Esperando selección de estación de Bizkaibus...</p>
        </section>

        <p class="data-source" id="dataSourceInfo"></p>
    </main>

    <script>
        let bizkaibusStopTimesData = [];
        let bizkaibusCalendarData = [];
        let bizkaibusCalendarDatesData = [];
        let bizkaibusTripsData = [];

        // Variable global para almacenar los datos en tiempo real de Bizkaibus
        let bizkaibusRealTimeData = [];
        let realTimeFetchInterval = null; // Para controlar el intervalo de actualización
        let latestRenderToken = 0; // Evita que una respuesta antigua pise a una más reciente

        const metroStations = [
            { code: "PLE", name: "Plentzia" },
            { code: "URD", name: "Urduliz" },
            { code: "SOP", name: "Sopela" },
            { code: "LAR", name: "Larrabasterra" },
            { code: "BER", name: "Berango" },
            { code: "IBB", name: "Ibarbengoa" },
            { code: "BID", name: "Bidezabal" },
            { code: "ALG", name: "Algorta" },
            { code: "AIB", name: "Aiboa" },
            { code: "NEG", name: "Neguri" },
            { code: "GOB", name: "Gobela" },
            { code: "ARE", name: "Areeta" },
            { code: "LAM", name: "Lamiako" },
            { code: "LEI", name: "Leioa" },
            { code: "AST", name: "Astrabudua" },
            { code: "ERA", name: "Erandio" },
            { code: "LUT", name: "Lutxana" },
            { code: "KAB", name: "Kabiezes" },
            { code: "STZ", name: "Santurtzi" },
            { code: "PEN", name: "Peñota" },
            { code: "POR", name: "Portugalete" },
            { code: "ABT", name: "Abatxolo" },
            { code: "SES", name: "Sestao" },
            { code: "URB", name: "Urbinaga" },
            { code: "BAG", name: "Bagatza" },
            { code: "BAR", name: "Barakaldo" },
            { code: "ANS", name: "Ansio" },
            { code: "GUR", name: "Gurutzeta / Cruces" },
            { code: "SIN", name: "San Ignazio" },
            { code: "SAR", name: "Sarriko" },
            { code: "DEU", name: "Deustu" },
            { code: "SAM", name: "Santimami / San Mamés" },
            { code: "IND", name: "Indautxu" },
            { code: "MOY", name: "Moyua" },
            { code: "ABA", name: "Abando" },
            { code: "CAV", name: "Zazpikaleak / Casco Viejo" },
            { code: "SAN", name: "Santutxu" },
            { code: "BAS", name: "Basarrate" },
            { code: "BOL", name: "Bolueta" },
            { code: "ETX", name: "Etxebarri" },
            { code: "ARZ", name: "Ariz" },
            { code: "BSR", name: "Basauri" }
        ];

        // Líneas de Bizkaibus que se pueden coger en cada parada según el destino elegido.
        // Ortuella es el destino por defecto.
        const LINES_POR_ORTUELLA = [{ routeId: 'A3333', headsigns: ['GALLARTA', 'LA ARBOLEDA'] }];
        const LINES_BAG_ORTUELLA = [{ routeId: 'A3338', headsigns: ['MUSKIZ', 'MUSKIZ La Arena'] }];
        const LINES_GUR_ORTUELLA = [{ routeId: 'A3336', headsigns: ['MUSKIZ', 'MUSKIZ La Arena', 'SOPUERTA'] }];
        const LINE_3141_TRAPAGARAN = { routeId: 'A3141', headsigns: ['VALLE DE TRAPAGA'] };

        const DESTINATION_LABELS = { ORTUELLA: 'Ortuella', TRAPAGARAN: 'Trapagaran' };

        const bizkaibusCorrespondenceMap = {
            "POR": {
                stopId: '450',
                stopName: 'Carlos VII 18',
                linesByDestination: {
                    ORTUELLA: LINES_POR_ORTUELLA,
                    // La A3333 no sirve para Trapagaran: solo la A3332 con destino TRAPAGARAN
                    TRAPAGARAN: [{ routeId: 'A3332', headsigns: ['TRAPAGARAN'] }]
                }
            },
            "BAG": {
                stopId: '411',
                stopName: 'Beurko (Av. Miranda 2)',
                linesByDestination: {
                    ORTUELLA: LINES_BAG_ORTUELLA,
                    // Las de Ortuella también llevan a Trapagaran, más la A3141
                    TRAPAGARAN: [...LINES_BAG_ORTUELLA, LINE_3141_TRAPAGARAN]
                }
            },
            "GUR": {
                stopId: '402',
                stopName: 'Cruces Ospitalea (Horacio Etxebarrieta)',
                linesByDestination: {
                    ORTUELLA: LINES_GUR_ORTUELLA,
                    TRAPAGARAN: [...LINES_GUR_ORTUELLA, LINE_3141_TRAPAGARAN]
                }
            }
        };

        function getSelectedTravelDestination() {
            const checked = document.querySelector('input[name="travelDestination"]:checked');
            return checked && DESTINATION_LABELS[checked.value] ? checked.value : 'ORTUELLA';
        }

        function getBusLinesForSelection(bizkaibusInfo) {
            return bizkaibusInfo.linesByDestination[getSelectedTravelDestination()] || bizkaibusInfo.linesByDestination.ORTUELLA;
        }

        function busHeading(bizkaibusInfo) {
            const destName = DESTINATION_LABELS[getSelectedTravelDestination()];
            return `<h2>Próximos autobuses a ${destName} · Parada ${bizkaibusInfo.stopId} · ${bizkaibusInfo.stopName}</h2>`;
        }

        // Si los datos de RIX llevan sin actualizarse más de estos días, se usan los de GitHub.
        const MAX_DATA_AGE_DAYS = 30;

        // Fuente principal: RIX
        const RIX_URLS = {
            stopTimes:     'https://dl.rix.dev/bizkaibus/stop_times1.txt',
            calendar:      'https://dl.rix.dev/bizkaibus/calendar.txt',
            calendarDates: 'https://dl.rix.dev/bizkaibus/calendar_dates.txt',
            trips:         'https://dl.rix.dev/bizkaibus/trips.txt'
        };

        // Fuente de respaldo: GitHub
        const STOP_TIMES1_URL = "https://raw.githubusercontent.com/jaimeeeefer/bizkaibus/refs/heads/main/datos/stop_times1.txt";
        const CALENDAR_URL = "https://raw.githubusercontent.com/jaimeeeefer/bizkaibus/refs/heads/main/datos/calendar.txt";
        const CALENDAR_DATES_URL = "https://raw.githubusercontent.com/jaimeeeefer/bizkaibus/refs/heads/main/datos/calendar_dates.txt";
        const TRIPS_URL = "https://raw.githubusercontent.com/jaimeeeefer/bizkaibus/refs/heads/main/datos/trips.txt";
        const GITHUB_URLS = {
            stopTimes:     STOP_TIMES1_URL,
            calendar:      CALENDAR_URL,
            calendarDates: CALENDAR_DATES_URL,
            trips:         TRIPS_URL
        };

        const metroBilbaoApiBaseUrl = 'https://api.metrobilbao.eus/metro/real-time';
        const bizkaibusRealTimeApiUrl = 'https://info-bizkaibus.jaimeferni10.workers.dev/'; // Nueva API para tiempo real

        // Función para poblar el desplegable de estaciones de Metro
        function populateMetroStationsDropdown() {
            const datalist = document.getElementById('metroStationsList');
            metroStations.forEach(station => {
                const option = document.createElement('option');
                option.value = `${station.name} (${station.code})`;
                datalist.appendChild(option);
            });
        }

        // Descarga los 4 ficheros de un origen. Devuelve los textos y la antigüedad (días) del más antiguo,
        // según la cabecera Last-Modified (null si el servidor no la envía).
        async function fetchDataSet(urls) {
            const keys = ['stopTimes', 'calendar', 'calendarDates', 'trips'];
            const responses = await Promise.all(keys.map(k => fetch(urls[k], { cache: 'no-cache' })));

            responses.forEach(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status} en ${r.url}`);
            });

            const texts = await Promise.all(responses.map(r => r.text()));
            texts.forEach((t, i) => {
                // Evita aceptar páginas de error HTML o ficheros vacíos
                if (!t.trim() || t.trim().startsWith('<')) {
                    throw new Error(`Contenido no válido en ${responses[i].url}`);
                }
            });

            let oldestAgeDays = null;
            responses.forEach(r => {
                const lm = r.headers.get('Last-Modified');
                if (lm) {
                    const ts = new Date(lm).getTime();
                    if (!isNaN(ts)) {
                        const age = (Date.now() - ts) / 86400000;
                        if (oldestAgeDays === null || age > oldestAgeDays) oldestAgeDays = age;
                    }
                }
            });

            const data = {
                stopTimes: parseCSV(texts[0]),
                calendar: parseCSV(texts[1]),
                calendarDates: parseCSV(texts[2]),
                trips: parseCSV(texts[3])
            };
            return { data, ageDays: oldestAgeDays };
        }

        // ¿El calendario ya no cubre la fecha de hoy? (end_date máxima anterior a hoy)
        function isCalendarExpired(calendar) {
            const now = new Date();
            const today = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
            const maxEnd = Math.max(...calendar.map(s => parseInt(s.end_date) || 0));
            return maxEnd < today;
        }

        function applyBizkaibusData(data) {
            bizkaibusStopTimesData = data.stopTimes;
            bizkaibusCalendarData = data.calendar;
            bizkaibusCalendarDatesData = data.calendarDates;
            bizkaibusTripsData = data.trips;
        }

        function setDataSourceInfo(text, warn) {
            const el = document.getElementById('dataSourceInfo');
            if (!el) return;
            el.textContent = text;
            el.classList.toggle('warn', !!warn);
        }

        async function loadBizkaibusData() {
            try {
                let rix = null;
                let rixProblem = null;

                // 1) Intentar con RIX
                try {
                    rix = await fetchDataSet(RIX_URLS);
                    if (rix.ageDays !== null && rix.ageDays > MAX_DATA_AGE_DAYS) {
                        rixProblem = `sin actualizar desde hace ${Math.floor(rix.ageDays)} días`;
                    } else if (isCalendarExpired(rix.data.calendar)) {
                        rixProblem = 'el calendario ha caducado';
                    }
                } catch (e) {
                    console.warn('RIX no disponible:', e);
                    rixProblem = 'no disponible';
                }

                let source;
                if (!rixProblem) {
                    applyBizkaibusData(rix.data);
                    source = 'RIX';
                    setDataSourceInfo(
                        rix.ageDays !== null
                            ? `Datos teóricos: RIX (actualizados hace ${Math.floor(rix.ageDays)} días)`
                            : 'Datos teóricos: RIX',
                        false
                    );
                } else {
                    // 2) Respaldo: GitHub
                    console.warn(`Usando GitHub como respaldo (RIX: ${rixProblem})`);
                    try {
                        const gh = await fetchDataSet(GITHUB_URLS);
                        applyBizkaibusData(gh.data);
                        source = 'GitHub';
                        setDataSourceInfo(`Datos teóricos: GitHub (RIX ${rixProblem})`, true);
                    } catch (ghError) {
                        console.error('GitHub tampoco disponible:', ghError);
                        if (rix) {
                            // RIX respondió pero estaba desactualizado: mejor eso que nada
                            applyBizkaibusData(rix.data);
                            source = 'RIX (desactualizado)';
                            setDataSourceInfo(`Datos teóricos: RIX (${rixProblem}) y GitHub no disponible`, true);
                        } else {
                            throw ghError;
                        }
                    }
                }
                console.log('Datos estáticos de Bizkaibus cargados desde:', source);

                // Initial messages after loading common Bizkaibus data
                document.getElementById('metroResults').innerHTML = '<p style="text-align: center;">Datos de Bizkaibus cargados. Selecciona una estación de Metro para buscar.</p>';
                document.getElementById('bizkaibusResults').innerHTML = '<p style="text-align: center;">Datos de Bizkaibus cargados. Selecciona una parada de Bizkaibus para ver los autobuses.</p>';

            } catch (error) {
                console.error('Error loading static Bizkaibus data:', error);
                setDataSourceInfo('No se pudieron cargar los datos teóricos (ni RIX ni GitHub)', true);
                document.getElementById('metroResults').innerHTML = '<p class="error-message">Error al cargar datos estáticos de Bizkaibus. Inténtalo de nuevo más tarde.</p>';
                document.getElementById('bizkaibusResults').innerHTML = '<p class="error-message">Error al cargar datos estáticos de Bizkaibus.</p>';
            }
        }

        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',');
            return lines.slice(1).map(line => {
                const values = line.split(',');
                const row = {};
                headers.forEach((header, i) => {
                    row[header.trim()] = values[i] ? values[i].trim() : '';
                });
                return row;
            });
        }

        function getDayOfWeek(date) {
            const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
            return days[date.getDay()];
        }

        function convertTimeToMinutes(timeStr) {
            if (typeof timeStr !== 'string' || timeStr.trim() === '') {
                console.warn('Invalid time string for convertTimeToMinutes:', timeStr);
                return NaN; // Return NaN for invalid input
            }
            const parts = timeStr.split(':').map(Number);
            // Ensure parts has at least 2 elements (hours, minutes)
            if (parts.length < 2) {
                console.warn('Time string format unexpected:', timeStr);
                return NaN;
            }
            const hours = parts[0];
            const minutes = parts[1];
            const seconds = parts[2] || 0;
            return (hours * 60) + minutes + (seconds / 60);
        }

        function formatMinutesToHHMM(minutesTotal) {
            if (isNaN(minutesTotal)) {
                return 'N/A';
            }
            const hours = Math.floor(minutesTotal / 60);
            const minutes = Math.round(minutesTotal % 60);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        // Estación donde siempre se hace el transbordo de Línea 1 a Línea 2
        const TRANSFER_STATION_CODE = 'SIN';

        async function fetchMetroLeg(from, to) {
            const url = `${metroBilbaoApiBaseUrl}/${from}/${to}`;
            const response = await fetch(url);
            if (!response.ok) {
                console.error(`Metro Bilbao API HTTP Error: Status ${response.status}, URL: ${url}`);
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        }

        // La API avisa con "transfer": true cuando el trayecto requiere transbordo en Metro
        function isTransferResponse(data) {
            return !!data && (data.transfer === true || (data.trip && data.trip.transfer === true));
        }

        function isValidLeg(leg) {
            return !!leg && !isTransferResponse(leg) && Array.isArray(leg.trains) && leg.trip
                && typeof leg.trip.duration === 'number';
        }

        // Trayecto con transbordo: origen -> SIN y SIN -> destino. Por cada tren del primer tramo
        // se busca el primer tren del segundo tramo que sale de SIN cuando ya ha llegado.
        async function buildTransferTrains(originCode, destinationCode, currentTimeInMinutes) {
            const [leg1, leg2] = await Promise.all([
                fetchMetroLeg(originCode, TRANSFER_STATION_CODE),
                fetchMetroLeg(TRANSFER_STATION_CODE, destinationCode)
            ]);
            if (!isValidLeg(leg1) || !isValidLeg(leg2)) {
                throw new Error('Respuesta de Metro Bilbao no válida para el transbordo');
            }

            const transferStationName = metroStations.find(s => s.code === TRANSFER_STATION_CODE)?.name || TRANSFER_STATION_CODE;
            const secondLegDepartures = leg2.trains
                .map(t => ({ time: t.timeRounded, minutes: convertTimeToMinutes(t.timeRounded) }))
                .filter(t => !isNaN(t.minutes))
                .sort((a, b) => a.minutes - b.minutes);

            const result = [];
            leg1.trains.forEach(train => {
                const departureMinutes = convertTimeToMinutes(train.timeRounded);
                if (isNaN(departureMinutes)) return;
                const arrivalAtTransferMinutes = departureMinutes + leg1.trip.duration;

                const nextTrain = secondLegDepartures.find(t => t.minutes >= arrivalAtTransferMinutes);
                if (!nextTrain) {
                    // La API aún no conoce los trenes de SIN a esa hora: se muestra solo la llegada a SIN
                    result.push({
                        departureTimeFromOrigin: train.timeRounded,
                        arrivalTimeAtDestination: null,
                        line: leg1.trip.line,
                        destination: transferStationName,
                        // Solo se usa para ordenar y descartar trenes pasados (estimación mínima)
                        timeToArrivalAtDestination: arrivalAtTransferMinutes + leg2.trip.duration - currentTimeInMinutes,
                        arrivalTimeAtDestinationMinutes: null,
                        transfer: {
                            pending: true,
                            stationName: transferStationName,
                            arrivalTime: formatMinutesToHHMM(arrivalAtTransferMinutes)
                        }
                    });
                    return;
                }

                const arrivalAtDestinationMinutes = nextTrain.minutes + leg2.trip.duration;
                result.push({
                    departureTimeFromOrigin: train.timeRounded,
                    arrivalTimeAtDestination: formatMinutesToHHMM(arrivalAtDestinationMinutes),
                    line: leg1.trip.line,
                    destination: transferStationName,
                    timeToArrivalAtDestination: arrivalAtDestinationMinutes - currentTimeInMinutes,
                    arrivalTimeAtDestinationMinutes: arrivalAtDestinationMinutes,
                    transfer: {
                        stationName: transferStationName,
                        arrivalTime: formatMinutesToHHMM(arrivalAtTransferMinutes),
                        departureTime: nextTrain.time,
                        waitMinutes: Math.round(nextTrain.minutes - arrivalAtTransferMinutes),
                        line2: leg2.trip.line
                    }
                });
            });
            return result;
        }

        // Sustituye el contenido de un contenedor de golpe (sin pasar por un estado vacío ni "cargando")
        // y solo si algo ha cambiado de verdad.
        function swapContent(container, buffer) {
            if (container.innerHTML === buffer.innerHTML) return;
            container.replaceChildren(...buffer.childNodes);
        }

        // silent = true: actualización automática; no se muestran mensajes de carga ni errores,
        // se mantienen los datos en pantalla hasta tener los nuevos.
        async function fetchAndProcessRealTimeBizkaibusData(silent = false) {
            const bizkaibusSelection = document.getElementById('bizkaibusDestinationStation').value;
            // bizkaibusSelection ahora es el código de Metro (ej: "POR", "BAG", "GUR")
            const bizkaibusInfo = bizkaibusCorrespondenceMap[bizkaibusSelection];

            // LOG: Bizkaibus Info
            console.log('LOG: Bizkaibus Info:', bizkaibusInfo);

            const bizkaibusResultsContainer = document.getElementById('bizkaibusResults');

            if (!bizkaibusInfo) {
                bizkaibusResultsContainer.innerHTML = `<h2>Próximos autobuses Bizkaibus</h2><p class="error-message">Error: No se pudo encontrar la información para la parada seleccionada de Bizkaibus.</p>`;
                return;
            }

            if (!silent) {
                bizkaibusResultsContainer.innerHTML = `${busHeading(bizkaibusInfo)}<p class="loading">Obteniendo datos en tiempo real...</p>`;
            }

            try {
                const response = await fetch(bizkaibusRealTimeApiUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const text = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, "application/xml");

                let vehicleActivities = xmlDoc.getElementsByTagName('VehicleActivity');
                bizkaibusRealTimeData = []; // Clear previous real-time data

                for (let i = 0; i < vehicleActivities.length; i++) {
                    const activity = vehicleActivities[i];
                    const tripIdElement = activity.getElementsByTagName('VehicleJourneyRef')[0];
                    const recordedAtTimeElement = activity.getElementsByTagName('RecordedAtTime')[0];
                    const monitoredCallElement = activity.getElementsByTagName('MonitoredCall')[0];

                    if (tripIdElement && recordedAtTimeElement && monitoredCallElement) {
                        const tripId = tripIdElement.textContent;
                        const recordedAtTimeStr = recordedAtTimeElement.textContent;
                        const stopPointRefElement = monitoredCallElement.getElementsByTagName('StopPointRef')[0];
                        const arrivalStatusElement = monitoredCallElement.getElementsByTagName('ArrivalStatus')[0];
                        
                        // NEW: Extract route from trip_id for real-time data as well
                        let routeIdFromTripId = null;
                        const match = tripId.match(/trp_([A-Za-z0-9]+)_/);
                        if (match && match[1]) {
                            routeIdFromTripId = match[1];
                        }
                        
                        if (stopPointRefElement && arrivalStatusElement && routeIdFromTripId) {
                            bizkaibusRealTimeData.push({
                                tripId: tripId,
                                routeId: routeIdFromTripId, // Use the extracted routeId
                                recordedAtTime: new Date(recordedAtTimeStr),
                                stopPointRef: stopPointRefElement.textContent, // The stop where it was recorded
                                arrivalStatus: arrivalStatusElement.textContent
                            });
                        }
                    }
                }
                // Trigger re-display to update with real-time data
                displayNextArrivalsAndCorrespondence(true, silent);
            } catch (error) {
                console.error('Error fetching real-time Bizkaibus data:', error);
                if (!silent) {
                    bizkaibusResultsContainer.innerHTML = `${busHeading(bizkaibusInfo)}<p class="error-message">Error al cargar datos en tiempo real: ${error.message}</p>`;
                }
            }
        }

        async function displayNextArrivalsAndCorrespondence(fetchMetroData = true, silent = false) {
            const renderToken = ++latestRenderToken;
            const stationInput = document.getElementById('metroStationCode').value.trim();
            const match = stationInput.match(/\((\w+)\)$/);
            const metroStationCode = match ? match[1] : null;

            const bizkaibusSelection = document.getElementById('bizkaibusDestinationStation').value;
            // bizkaibusSelection ahora es el código de Metro (ej: "POR", "BAG", "GUR")
            const bizkaibusInfo = bizkaibusCorrespondenceMap[bizkaibusSelection];

            if (!bizkaibusInfo) {
                document.getElementById('bizkaibusResults').innerHTML = `<h2>Próximos autobuses Bizkaibus</h2><p class="error-message">Error: No se pudo encontrar la información para la parada seleccionada de Bizkaibus.</p>`;
                return;
            }

            // El código de destino de Metro es la clave de la selección de Bizkaibus
            const metroDestinationCode = bizkaibusSelection; 

            const metroResultsContainer = document.getElementById('metroResults');
            const bizkaibusResultsContainer = document.getElementById('bizkaibusResults');

            if (!silent) {
                if (fetchMetroData) {
                    metroResultsContainer.innerHTML = '<p class="loading">Buscando trenes de Metro Bilbao...</p>';
                }
                bizkaibusResultsContainer.innerHTML = `${busHeading(bizkaibusInfo)}<p class="loading">Cargando autobuses Bizkaibus...</p>`;
            }

            if (!metroStationCode) {
                metroResultsContainer.innerHTML = '<p class="hint">Escribe o selecciona tu estación de Metro de origen y pulsa Buscar.</p>';
                bizkaibusResultsContainer.innerHTML = `${busHeading(bizkaibusInfo)}<p class="loading">Esperando selección de estación de Metro.</p>`;
                return;
            }

            if (metroStationCode === metroDestinationCode) {
                metroResultsContainer.innerHTML = `<p class="error-message">La estación de origen (${metroStationCode}) no puede ser la misma que la estación de destino (${metroDestinationCode}). Por favor, selecciona otra estación de origen.</p>`;
                bizkaibusResultsContainer.innerHTML = `${busHeading(bizkaibusInfo)}<p class="loading">Corrige la estación de Metro de origen.</p>`;
                return;
            }

            const now = new Date();
            const currentDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const currentTimeInMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

            let metroBilbaoTrains = [];
            let metroFetchFailed = false;
            if (fetchMetroData) {
                try {
                    const data = await fetchMetroLeg(metroStationCode, metroDestinationCode);

                    if (isTransferResponse(data)) {
                        // Línea 1 -> Bizkaibus: transbordo en San Ignazio
                        metroBilbaoTrains = await buildTransferTrains(metroStationCode, metroDestinationCode, currentTimeInMinutes);
                    } else if (data && Array.isArray(data.trains) && data.trip) {
                        const tripDurationMinutes = data.trip.duration;
                        const tripLine = data.trip.line;
                        const tripToStationName = data.trip.toStation.name;
                        const originStationName = metroStations.find(s => s.code === metroStationCode)?.name || metroStationCode;

                        metroBilbaoTrains = data.trains.map(train => {
                            const departureTimeFromOriginMinutes = convertTimeToMinutes(train.timeRounded);
                            const arrivalTimeAtDestinationMinutes = departureTimeFromOriginMinutes + tripDurationMinutes;

                            return {
                                departureTimeFromOrigin: train.timeRounded,
                                arrivalTimeAtDestination: formatMinutesToHHMM(arrivalTimeAtDestinationMinutes),
                                line: tripLine,
                                destination: tripToStationName,
                                timeToArrivalAtDestination: arrivalTimeAtDestinationMinutes - currentTimeInMinutes,
                                arrivalTimeAtDestinationMinutes: arrivalTimeAtDestinationMinutes
                            };
                        });
                    } else {
                        // Log the unexpected data structure
                        console.error('Metro Bilbao API response unexpected or empty trains array:', data);
                        metroFetchFailed = true;
                        if (!silent) {
                            metroResultsContainer.innerHTML = '<p class="no-results">Formato de respuesta de Metro Bilbao inesperado o no se encontraron trenes. Por favor, inténtalo de nuevo más tarde.</p>';
                        }
                        metroBilbaoTrains = [];
                    }

                } catch (error) {
                    console.error('Error fetching Metro Bilbao data:', error);
                    const originStationNameForDisplay = metroStations.find(s => s.code === metroStationCode)?.name || metroStationCode;
                    const destinationStationNameForDisplay = metroStations.find(s => s.code === metroDestinationCode)?.name || metroDestinationCode;
                    metroFetchFailed = true;
                    if (!silent) {
                        metroResultsContainer.innerHTML = `<p class="error-message">Error al obtener datos de Metro Bilbao para ${originStationNameForDisplay} a ${destinationStationNameForDisplay}. (${error.message}). Por favor, verifica tu selección e inténtalo de nuevo.</p>`;
                    }
                    metroBilbaoTrains = [];
                }
            }

            // Si mientras esperábamos se lanzó una actualización más reciente, descartamos esta
            if (renderToken !== latestRenderToken) return;

            // --- Calculate Bizkaibus data for correspondence check ---
            const activeServiceIdsBizkaibus = getServiceIdsForDate(currentDay, bizkaibusCalendarData, bizkaibusCalendarDatesData);

            const stopTimesAtBizkaibusStation = bizkaibusStopTimesData.filter(st => st.stop_id === bizkaibusInfo.stopId);

            const relevantBizkaibusTrips = bizkaibusTripsData.filter(trip => activeServiceIdsBizkaibus.has(trip.service_id));
            const tripIdsWithServiceBizkaibus = new Set(relevantBizkaibusTrips.map(trip => trip.trip_id));

            const filteredBizkaibusStopTimes = stopTimesAtBizkaibusStation.filter(st => tripIdsWithServiceBizkaibus.has(st.trip_id));

            const bizkaibusDepartures = [];
            filteredBizkaibusStopTimes.forEach(stopTime => {
                const departureTimeInMinutes = convertTimeToMinutes(stopTime.departure_time);

                let actualDepartureTimeInMinutes = departureTimeInMinutes;
                // Handling times past 24:00 for the current day
                if (departureTimeInMinutes >= 24 * 60) {
                    actualDepartureTimeInMinutes -= 24 * 60;
                }

                let timeDifference = departureTimeInMinutes - currentTimeInMinutes;

                // Adjust for overnight services (e.g., if current time is late at night and bus departs early next morning)
                if (timeDifference < 0 && departureTimeInMinutes < 4 * 60 && currentTimeInMinutes > 20 * 60) {
                     timeDifference += 24 * 60;
                }

                if (timeDifference >= -5) {
                    const trip = bizkaibusTripsData.find(t => t.trip_id === stopTime.trip_id);
                    if (trip) {
                        const busHeadsign = stopTime.stop_headsign || trip.trip_headsign || 'Desconocido';
                        
                        // NEW LOGIC: Extract route from trip_id string
                        let extractedRouteId = 'Desconocido';
                        const matchTripId = stopTime.trip_id.match(/trp_([A-Za-z0-9]+)_/); // e.g., extracts A3333 from trp_A3333_...
                        if (matchTripId && matchTripId[1]) {
                            extractedRouteId = matchTripId[1];
                        }
                        // console.log(`  LOG: Extracted Route ID from trip_id "${stopTime.trip_id}": "${extractedRouteId}"`);

                        bizkaibusDepartures.push({
                            departureTime: stopTime.departure_time,
                            departureTimeInMinutes: departureTimeInMinutes,
                            timeToDeparture: timeDifference,
                            headsign: busHeadsign,
                            tripId: stopTime.trip_id,
                            routeId: extractedRouteId // Use the extracted Route ID here
                        });
                        // console.log(`  LOG: Populating BizkaibusDeparture - Trip ID: ${stopTime.trip_id}, Extracted Route ID: ${extractedRouteId}, stopTime.stop_headsign: "${stopTime.stop_headsign}", trip.trip_headsign: "${trip.trip_headsign}", Final headsign property: "${busHeadsign}"`);
                    }
                }
            });

            // --- NEW: Filter bizkaibusDepartures based on lines and headsigns defined in bizkaibusCorrespondenceMap ---
            const relevantBizkaibusLines = getBusLinesForSelection(bizkaibusInfo);
            let filteredBizkaibusDepartures = bizkaibusDepartures.filter(bus => {
                // Return true if the bus should be included, false otherwise.
                // The 'some' method checks if any configLine satisfies the condition.
                return relevantBizkaibusLines.some(configLine => {
                    const routeMatches = bus.routeId === configLine.routeId; // Now bus.routeId comes from extracted part of trip_id
                    const headsignMatches = configLine.headsigns.some(hs => bus.headsign.toLowerCase().includes(hs.toLowerCase()));

                    return routeMatches && headsignMatches;
                });
            });
            // LOG: Filtered Bizkaibus Departures (after line/headsign filter) - This is the correct list for correspondence
            console.log('LOG: Filtered Bizkaibus Departures for correspondence:', filteredBizkaibusDepartures);
            // Precalcular delayMinutes y hora estimada para cada bus
            filteredBizkaibusDepartures.forEach(bus => {
                const realTimeBus = bizkaibusRealTimeData.find(rt =>
                    rt.tripId === bus.tripId && rt.routeId === bus.routeId
                );

                if (realTimeBus) {
                    const theoreticalStopTimeEntry = bizkaibusStopTimesData.find(st =>
                        st.trip_id === realTimeBus.tripId && st.stop_id === realTimeBus.stopPointRef
                    );

                    if (theoreticalStopTimeEntry) {
                        const stopsForTrip = bizkaibusStopTimesData.filter(st => st.trip_id === realTimeBus.tripId);

                        // Buscar la primera parada (stop_sequence === '1')
                        const originStop = stopsForTrip.find(st => st.stop_sequence === '1');

                        if (originStop) {
                            const originTimeStr = originStop.departure_time;
                            const [h, m, s] = originTimeStr.split(':').map(Number);
                            const originTime = new Date(realTimeBus.recordedAtTime);
                            
                            if (h >= 24) {
                                originTime.setDate(originTime.getDate() + 1);
                            }
                            originTime.setHours(h % 24, m, s || 0, 0);

                            const now = realTimeBus.recordedAtTime;
                            const diffMinutes = (now - originTime) / 60000;

                            // Solo calculamos delay si ya ha salido de la parada de origen
                            if (diffMinutes >= 0) {
                                const theoreticalTimeStr = theoreticalStopTimeEntry.departure_time;
                                const theoreticalDate = new Date(now);
                                let [ht, mt, st_] = theoreticalTimeStr.split(':').map(Number);
                                if (ht >= 24) {
                                    theoreticalDate.setDate(theoreticalDate.getDate() + 1);
                                }
                                theoreticalDate.setHours(ht % 24, mt, st_ || 0, 0);

                                let delayMinutes = (now - theoreticalDate) / 60000;

                                if (delayMinutes > 720) delayMinutes -= 1440;
                                if (delayMinutes < -720) delayMinutes += 1440;

                                bus.delayMinutes = delayMinutes;

                                const baseMinutes = convertTimeToMinutes(bus.departureTime.split(':').slice(0, 2).join(':'));
                                bus.estimatedDepartureMinutes = baseMinutes + delayMinutes;
                            } else {
                                // Aún no ha salido del origen, mostrar en hora
                                bus.delayMinutes = 0;
                                const baseMinutes = convertTimeToMinutes(bus.departureTime.split(':').slice(0, 2).join(':'));
                                bus.estimatedDepartureMinutes = baseMinutes;
                            }
                        }
                    }
                } else {
                    // Si no hay tiempo real, usar hora teórica como estimada
                    const baseMinutes = convertTimeToMinutes(bus.departureTime.split(':').slice(0, 2).join(':'));
                    bus.estimatedDepartureMinutes = baseMinutes;
                }
            });

            // Ordenar salidas por hora teórica (sin importar cuántos destinos haya)
            filteredBizkaibusDepartures.sort((a, b) => {
                return a.departureTimeInMinutes - b.departureTimeInMinutes;
            });

            // Eliminar buses que ya han salido (con adelanto incluido)
            filteredBizkaibusDepartures = filteredBizkaibusDepartures.filter(bus => {
                const cleanTime = bus.departureTime.split(':').slice(0, 2).join(':');
                let estimatedMinutes = convertTimeToMinutes(cleanTime);
                if (bus.delayMinutes !== undefined) {
                    estimatedMinutes += bus.delayMinutes;
                }
                return estimatedMinutes >= currentTimeInMinutes - 0.5;
            });

            // --- Display Metro Bilbao results with correspondence ---
            const originStationNameForDisplay = metroStations.find(s => s.code === metroStationCode)?.name || metroStationCode;
            const destinationStationNameForDisplay = metroStations.find(s => s.code === metroDestinationCode)?.name || metroDestinationCode;

            const metroBuffer = document.createElement('div');
            if (metroBilbaoTrains.length > 0) {
                metroBuffer.innerHTML = `<h2>Próximos trenes de Metro Bilbao desde ${originStationNameForDisplay} hacia ${destinationStationNameForDisplay}</h2>`;
                const sortedMetroTrains = metroBilbaoTrains.sort((a, b) => a.timeToArrivalAtDestination - b.timeToArrivalAtDestination);

                sortedMetroTrains.forEach(train => {
                    if (train.timeToArrivalAtDestination >= -5) {
                        const trainInfoDiv = document.createElement('div');
                        trainInfoDiv.classList.add('train-info');

                        let correspondenceMessage = '';
                        // NOW USE filteredBizkaibusDepartures for the correspondence check
                        const hasCorrespondence = !(train.transfer && train.transfer.pending) && filteredBizkaibusDepartures.some(bus => {
                            const cleanBusTime = bus.departureTime.split(':').slice(0, 2).join(':');
                            let estimatedBusTime = convertTimeToMinutes(cleanBusTime);
                            if (typeof bus.delayMinutes === 'number') {
                                estimatedBusTime += bus.delayMinutes;
                            }

                            // ❌ Si el tren llega después del bus estimado, no hay enlace
                            if (train.arrivalTimeAtDestinationMinutes > estimatedBusTime) {
                                return false;
                            }

                            const timeDifferenceMetroBus = estimatedBusTime - train.arrivalTimeAtDestinationMinutes;

                            if (timeDifferenceMetroBus > 2 && timeDifferenceMetroBus <= 10) {
                                correspondenceMessage = `<span class="correspondence-text">Enlace</span>`;
                                return true;
                            } else if (timeDifferenceMetroBus >= 0.5 && timeDifferenceMetroBus <= 2) {
                                correspondenceMessage = `<span class="correspondencejusta-text">Enlace justo</span>`;
                                return true;
                            } else if (timeDifferenceMetroBus > 10 && timeDifferenceMetroBus <= 15) {
                                correspondenceMessage = `<span class="correspondence-text">Enlace largo</span>`;
                                return true;
                            }

                            return false;
                        });

                        const tr = train.transfer;
                        const depRow = (label, time) => `<div class="card-row"><span>${label}</span><b>${time}</b></div>`;
                        const arrRow = (label, time) => `<div class="card-row card-row-arrival"><span>${label}</span><b>${time}</b></div>`;
                        const finalArrival = arrRow(`Llegada a ${destinationStationNameForDisplay} (en ${formatTime(train.timeToArrivalAtDestination, train.departureTimeFromOrigin)})`, train.arrivalTimeAtDestination);

                        let rows;
                        if (tr && tr.pending) {
                            // Aún sin previsión del tren de San Ignazio: solo hasta la llegada al transbordo
                            rows = depRow(`Salida de ${originStationNameForDisplay}`, train.departureTimeFromOrigin)
                                 + arrRow(`Llegada a ${tr.stationName} (transbordo)`, tr.arrivalTime);
                        } else if (tr) {
                            rows = depRow(`Salida de ${originStationNameForDisplay}`, train.departureTimeFromOrigin)
                                 + arrRow(`Llegada a ${tr.stationName} (transbordo)`, tr.arrivalTime)
                                 + depRow(`Salida de ${tr.stationName} · Línea ${tr.line2} (espera ${tr.waitMinutes} min)`, tr.departureTime)
                                 + finalArrival;
                        } else {
                            rows = depRow(`Salida de ${originStationNameForDisplay}`, train.departureTimeFromOrigin)
                                 + finalArrival;
                        }

                        trainInfoDiv.innerHTML = `
                            <div class="card-head">
                                <span class="badge badge-metro">Línea ${train.line}</span>
                                <strong>hacia ${train.destination}</strong>
                                ${tr ? '<span class="transfer-text">Transbordo</span>' : ''}
                                ${correspondenceMessage}
                            </div>
                            ${rows}
                        `;
                        metroBuffer.appendChild(trainInfoDiv);
                    }
                });
            } else {
                metroBuffer.innerHTML = `<h2>Próximos trenes de Metro Bilbao desde ${originStationNameForDisplay} hacia ${destinationStationNameForDisplay}</h2><p class="no-results">No se encontraron trenes próximos para esta ruta de Metro Bilbao.</p>`;
            }

            // Volcar el Metro de golpe. Si falló la consulta, se conserva lo que ya había en pantalla.
            if (fetchMetroData && !metroFetchFailed) {
                swapContent(metroResultsContainer, metroBuffer);
            }

            // --- Display Bizkaibus data with real-time status ---
            const busBuffer = document.createElement('div');
            busBuffer.innerHTML = `${busHeading(bizkaibusInfo)}`;

            // Note: filteredBizkaibusDepartures is already correctly sorted by time and filtered by line/headsign
            // The display for Bizkaibus will now just use the already filtered and sorted list.

            if (filteredBizkaibusDepartures.length === 0) { // <--- USE filteredBizkaibusDepartures here too
                busBuffer.innerHTML += `<p class="no-results">No se encontraron autobuses Bizkaibus próximos para la parada ${bizkaibusInfo.stopId} hacia ${DESTINATION_LABELS[getSelectedTravelDestination()]}.</p>`;
            } else {

                const now = new Date();
                const nowInMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

                // ✅ Filtrar los buses que aún no han salido (o como mucho hace 1 minuto)
                const nextRelevantBizkaibus = filteredBizkaibusDepartures
                    .filter(bus => {
                        if (typeof bus.estimatedDepartureMinutes !== 'number' || isNaN(bus.estimatedDepartureMinutes)) return true;
                        return bus.estimatedDepartureMinutes >= nowInMinutes - 1;
                    })
                    .slice(0, 5);

                // ✅ Pintar los buses filtrados
                nextRelevantBizkaibus.forEach(bus => {
                    const busInfoDiv = document.createElement('div');
                    busInfoDiv.classList.add('bus-info');

                    let realTimeStatus = '';
                    if (typeof bus.delayMinutes === 'number') {
                        if (Math.abs(bus.delayMinutes) <= 2.5) {
                            realTimeStatus = `<span class="bus-status-ontime">En hora</span>`;
                        } else if (bus.delayMinutes > 2.5) {
                            realTimeStatus = `<span class="bus-status-late">Retrasado por ${Math.round(bus.delayMinutes)} min.</span>`;
                        } else {
                            realTimeStatus = `<span class="bus-status-early">Adelantado por ${Math.round(Math.abs(bus.delayMinutes))} min.</span>`;
                        }
                    } else {
                        realTimeStatus = `<span class="bus-status-unknown">Sin datos en tiempo real (teórico)</span>`;
                    }
                    const realTimeBus = bizkaibusRealTimeData.find(rt => rt.tripId === bus.tripId && rt.routeId === bus.routeId);

                    // Calcular la hora estimada para mostrar
                    const baseMinutes = convertTimeToMinutes(bus.departureTime.split(':').slice(0, 2).join(':'));
                    const estimatedMinutes = bus.delayMinutes !== undefined ? baseMinutes + bus.delayMinutes : baseMinutes;
                    const estimatedTimeHHMM = formatMinutesToHHMM(estimatedMinutes);

                    // Calcular tiempo hasta salida
                    const timeToDeparture = estimatedMinutes - nowInMinutes;

                    busInfoDiv.innerHTML = `
                        <div class="card-head">
                            <span class="badge badge-bus">${bus.routeId}</span>
                            <strong>hacia ${bus.headsign}</strong>
                        </div>
                        <div class="card-row"><span>Salida teórica (en ${formatTime(timeToDeparture)})</span><b>${bus.departureTime.split(':').slice(0, 2).join(':')}</b></div>
                        <div class="card-row"><span>Hora estimada</span><b>${estimatedTimeHHMM}</b></div>
                        <div class="card-row"><span>Estado</span>${realTimeStatus}</div>
                    `;

                    busBuffer.appendChild(busInfoDiv);
                });
            }

            swapContent(bizkaibusResultsContainer, busBuffer);
        }

        function getServiceIdsForDate(date, calendar, calendarDates) {
            const yyyymmdd = date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
            const dayOfWeek = getDayOfWeek(date);

            const activeServiceIds = new Set();

            calendar.forEach(service => {
                if (parseInt(service.start_date) <= yyyymmdd && parseInt(service.end_date) >= yyyymmdd) {
                    if (service[dayOfWeek] === '1') {
                        activeServiceIds.add(service.service_id);
                    }
                }
            });

            calendarDates.forEach(exception => {
                if (parseInt(exception.date) === yyyymmdd) {
                    if (exception.exception_type === '1') { // Service added
                        activeServiceIds.add(exception.service_id);
                    } else if (exception.exception_type === '2') { // Service removed
                        activeServiceIds.delete(exception.service_id);
                    }
                }
            });
            return activeServiceIds;
        }

        function formatTime(timeEstimated, timeRounded) {
            const formatMinutesToText = (minutes) => {
                if (minutes < -2) {
                    return 'Pasado';
                } else if (minutes <= 0) {
                    return 'En parada'; // Cambiado de 'Llegada'
                } else if (minutes === 1) {
                    return '1 minuto';
                } else if (minutes < 60) {
                    return `${Math.round(minutes)} minutos`;
                } else {
                    const hours = Math.floor(minutes / 60);
                    const remainingMinutes = Math.round(minutes % 60);
                    return `${hours}h ${remainingMinutes}min`;
                }
            };

            const estimatedText = formatMinutesToText(timeEstimated);

            let displayRoundedTime = 'N/A';
            // Se asegura que timeRounded sea una cadena antes de intentar procesarla
            if (typeof timeRounded === 'string' && timeRounded.trim() !== '') {
                const parts = timeRounded.split(':');
                if (parts.length === 3) { // Si el formato es HH:MM:SS
                    const totalMinutes = convertTimeToMinutes(timeRounded);
                    displayRoundedTime = formatMinutesToHHMM(totalMinutes);
                } else { // Asume que ya está en HH:MM o no necesita redondeo
                    displayRoundedTime = timeRounded.trim();
                }
            }

            return `${estimatedText}`;
        }

        // PWA: registrar el service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW no registrado:', err));
            });
        }

        // Manejo de la carga inicial y actualizaciones en tiempo real
        document.addEventListener('DOMContentLoaded', () => {
            populateMetroStationsDropdown();
            
            loadBizkaibusData().then(() => {
                // Configura la actualización en tiempo real de Bizkaibus
                // Llama inmediatamente para la parada por defecto y luego cada 30 segundos
                if (realTimeFetchInterval) {
                    clearInterval(realTimeFetchInterval);
                }
                fetchAndProcessRealTimeBizkaibusData(); 
                realTimeFetchInterval = setInterval(() => fetchAndProcessRealTimeBizkaibusData(true), 30000); 

                // Al cambiar la parada o el destino se refrescan los datos al momento
                const onSelectionChange = () => {
                    if (realTimeFetchInterval) {
                        clearInterval(realTimeFetchInterval);
                    }
                    fetchAndProcessRealTimeBizkaibusData();
                    realTimeFetchInterval = setInterval(() => fetchAndProcessRealTimeBizkaibusData(true), 30000);
                };
                document.getElementById('bizkaibusDestinationStation').addEventListener('change', onSelectionChange);
                document.querySelectorAll('input[name="travelDestination"]').forEach(radio => {
                    radio.addEventListener('change', onSelectionChange);
                });
            });
        });
    </script>
</body>
